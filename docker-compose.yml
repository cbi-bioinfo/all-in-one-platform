# Deployment manifest — FP-GNN Toxicity Predictor 1.0.0
#
# Batch job (T2, default):
#   INPUT_FILE=molecules.csv docker compose run --rm fpgnn-batch
# HTTP API — T2 job interface (POST /jobs, GET /jobs/{job_id}[/result]) and /predict:
#   docker compose --profile serve up -d fpgnn-serve
#
# Host directories: ./input (read-only) and ./output (must be writable by
# UID 10001, or set RUN_AS="$(id -u):$(id -g)").
# Measured on the 10,974-molecule trainset: peak RAM 0.80 GiB, peak GPU memory
# 254-280 MiB (incl. CUDA context), model load ~1 s. The GPU is optional (CPU speed
# depends strongly on other load on the host: 3-47 molecules/s measured).

x-common: &common
  image: cbibioinfolab/toxicity-prediction:fp-gnn-1.0.0
  platform: linux/amd64
  user: "${RUN_AS:-10001:10001}"
  deploy:
    resources:
      limits:
        memory: 2g
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  fpgnn-batch:
    <<: *common
    command: ["batch"]
    network_mode: none            # no network access at run time
    environment:
      INPUT_PATH: /data/input/${INPUT_FILE:-molecules.csv}
      OUTPUT_DIR: /data/output
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-csv}
      DEVICE: ${DEVICE:-auto}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      SEED: "42"
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output

  fpgnn-serve:
    <<: *common
    profiles: ["serve"]
    command: ["serve"]
    environment:
      DEVICE: ${DEVICE:-auto}
      MAX_REQUEST_ITEMS: "100"
      JOBS_DIR: /data/output/jobs
    volumes:
      - ./output:/data/output        # job inputs, results and checkpoints survive restarts
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"   # loopback only — the API has no authentication
    networks: [fpgnn-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  fpgnn-internal:
    driver: bridge
