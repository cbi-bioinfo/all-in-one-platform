# Deployment manifest — ToxKG-GPS Toxicity Predictor 1.0.0
#
# Batch job (T2, default):
#   INPUT_FILE=molecules.csv docker compose run --rm toxkggps-batch
# HTTP API (optional):
#   docker compose --profile serve up -d toxkggps-serve
#
# Host directories: ./input (read-only) and ./output (must be writable by
# UID 10001, or set RUN_AS="$(id -u):$(id -g)").
# Measured on the 10,974-molecule trainset: peak RAM 0.95 GiB, peak GPU memory
# 1.7 GB, model load ~2 s. A GPU is optional (CPU ~79 molecules/s); remove the
# `reservations` block to run on hosts without an NVIDIA GPU.

x-common: &common
  image: pzkeung/bio-synergy-platform:toxkg-gps-1.0.0
  platform: linux/amd64
  user: "${RUN_AS:-10001:10001}"
  deploy:
    resources:
      limits:
        memory: 4g
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  toxkggps-batch:
    <<: *common
    command: ["batch"]
    network_mode: none            # no network access at run time
    environment:
      INPUT_PATH: /data/input/${INPUT_FILE:-molecules.csv}
      OUTPUT_DIR: /data/output
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-csv}
      DEVICE: ${DEVICE:-auto}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      SEED: "42"
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output

  toxkggps-serve:
    <<: *common
    profiles: ["serve"]
    command: ["serve"]
    environment:
      DEVICE: ${DEVICE:-auto}
      MAX_REQUEST_ITEMS: "100"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"   # loopback only — the API has no authentication
    networks: [toxkggps-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s             # model load takes ~2 s
      retries: 3

networks:
  toxkggps-internal:
    driver: bridge
